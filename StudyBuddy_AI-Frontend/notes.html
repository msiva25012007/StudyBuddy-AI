
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyBuddy AI - Notes Generator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar navbar-dark custom-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold">
                🎓 StudyBuddy AI
            </a>

            <a href="dashboard.html" class="btn btn-primary btn-sm">
                Dashboard
            </a>
        </div>
    </nav>

    <section class="dashboard-header">
        <div class="container text-center">
            <h1>📚 Notes Generator</h1>
            <p>Generate AI-powered study notes instantly</p>
        </div>
    </section>

    <div class="container my-5">

        <div class="dashboard-card">

            <h4 class="mb-4">Enter Topic</h4>

            <input type="text" id="topic" class="form-control mb-3"
                placeholder="Example: Java Collections">

            <button onclick="generateNotes()" class="btn btn-success">
                Generate Notes
            </button>

            <div class="notes-box mt-4">

                <h5>Generated Notes</h5>

                <p id="notesOutput">
                    Your generated notes will appear here...
                </p>

            </div>

        </div>

    </div>

    <script>
        function generateNotes() {

            let topic = document.getElementById("topic").value;

            if (topic === "") {
                alert("Please enter a topic");
                return;
            }

            document.getElementById("notesOutput").innerHTML =
                "<strong>" + topic + "</strong><br><br>" +
                "• Introduction to " + topic + "<br>" +
                "• Important Concepts<br>" +
                "• Advantages and Applications<br>" +
                "• Summary and Key Points";
        }
    </script>

</body>

</html>
