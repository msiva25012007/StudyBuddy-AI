
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyBuddy AI - Study Planner</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar navbar-dark custom-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold">
                🎓 StudyBuddy AI
            </a>

            <a href="dashboard.html" class="btn btn-primary btn-sm">
                Dashboard
            </a>
        </div>
    </nav>

    <section class="dashboard-header">
        <div class="container text-center">
            <h1>📅 Study Planner</h1>
            <p>Create a personalized study schedule</p>
        </div>
    </section>

    <div class="container my-5">

        <div class="dashboard-card">

            <h4 class="mb-4">Enter Subject</h4>

            <input type="text" id="subject" class="form-control mb-3"
                placeholder="Example: Data Structures">

            <button onclick="createPlan()" class="btn btn-info text-white">
                Create Plan
            </button>

            <div class="planner-box mt-4">

                <h5>Study Schedule</h5>

                <ul id="planOutput">
                    <li>Your study plan will appear here...</li>
                </ul>

            </div>

        </div>

    </div>

    <script>
        function createPlan() {

            let subject = document.getElementById("subject").value;

            if (subject === "") {
                alert("Please enter a subject");
                return;
            }

            document.getElementById("planOutput").innerHTML = `
                <li>Day 1 - Learn Basics of ${subject}</li>
                <li>Day 2 - Study Core Concepts</li>
                <li>Day 3 - Practice Exercises</li>
                <li>Day 4 - Revise Notes</li>
                <li>Day 5 - Take Mock Test</li>
            `;
        }
    </script>

</body>

</html>
