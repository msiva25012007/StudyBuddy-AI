<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tutor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f4f7fc;
        }

        .chat-container{
            max-width:700px;
            margin:50px auto;
        }

        .chat-box{
            background:white;
            height:400px;
            overflow-y:auto;
            padding:20px;
            border-radius:15px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        .user-msg{
            background:#0d6efd;
            color:white;
            padding:10px;
            border-radius:10px;
            margin:10px 0;
            text-align:right;
        }

        .ai-msg{
            background:#e9ecef;
            padding:10px;
            border-radius:10px;
            margin:10px 0;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="chat-container">

        <h2 class="text-center mb-4">
            🤖 StudyBuddy AI Tutor
        </h2>

        <div class="chat-box" id="chatBox">

            <div class="ai-msg">
                Hello! Ask me any study-related question.
            </div>

        </div>

        <div class="input-group mt-3">

            <input
                type="text"
                id="question"
                class="form-control"
                placeholder="Ask your question...">

            <button
                class="btn btn-primary"
                onclick="askAI()">

                Send
            </button>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
