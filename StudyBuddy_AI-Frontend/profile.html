<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyBuddy AI - My Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>


<body>


<nav class="navbar navbar-dark custom-navbar">
    <div class="container">

        <a class="navbar-brand fw-bold">
            🎓 StudyBuddy AI
        </a>

        <a href="dashboard.html" class="btn btn-primary btn-sm">
            Dashboard
        </a>

    </div>
</nav>



<section class="dashboard-header">

    <div class="container text-center">

        <h1>👤 My Profile</h1>

        <p>Manage your academic journey</p>

    </div>

</section>




<div class="container my-5">


<div class="dashboard-card">


<div class="text-center">


<div class="icon">
👩‍🎓
</div>


<h3 id="userName">
Loading...
</h3>


<p class="text-muted" id="userEmail">
Loading...
</p>


<hr>


</div>





<div class="row mt-4">


<div class="col-md-6">


<p>
<strong>College:</strong>
<span id="college">-</span>
</p>


<p>
<strong>Department:</strong>
<span id="department">-</span>
</p>


<p>
<strong>Semester:</strong>
<span id="semester">-</span>
</p>


</div>





<div class="col-md-6">


<p>
<strong>Learning Goal:</strong>
<span id="goal">AI Engineer</span>
</p>


<p>
<strong>Skill Level:</strong>
<span id="level">Intermediate</span>
</p>


<p>
<strong>Status:</strong>
<span class="text-success">
Active Learner
</span>
</p>


</div>


</div>






<div class="row g-3 mt-4">



<div class="col-md-3">

<div class="dashboard-card text-center">

<h4 id="notes">
0
</h4>

<p>
Notes Generated
</p>

</div>

</div>






<div class="col-md-3">

<div class="dashboard-card text-center">

<h4 id="quiz">
0
</h4>

<p>
Quizzes Completed
</p>

</div>

</div>






<div class="col-md-3">

<div class="dashboard-card text-center">

<h4 id="hours">
0
</h4>

<p>
Study Hours
</p>

</div>

</div>






<div class="col-md-3">

<div class="dashboard-card text-center">

<h4 id="streak">
0
</h4>

<p>
Learning Streak
</p>

</div>

</div>




</div>



</div>


</div>





<script>


// Get logged in user data

let user = JSON.parse(localStorage.getItem("user"));



if(user){


    document.getElementById("userName").innerHTML =
    user.name || "Student";


    document.getElementById("userEmail").innerHTML =
    user.email || "Email not available";


    document.getElementById("college").innerHTML =
    user.college || "V.S.B Engineering College";


    document.getElementById("department").innerHTML =
    user.department || "AI & DS";


    document.getElementById("semester").innerHTML =
    user.semester || "V";


    document.getElementById("goal").innerHTML =
    user.goal || "AI Engineer";


    document.getElementById("level").innerHTML =
    user.level || "Intermediate";


    document.getElementById("notes").innerHTML =
    user.notes || 25;


    document.getElementById("quiz").innerHTML =
    user.quiz || 12;


    document.getElementById("hours").innerHTML =
    user.hours || 48;


    document.getElementById("streak").innerHTML =
    user.streak || 15;


}

else{


    alert("Please login first");

    window.location.href="login.html";


}



</script>



</body>

</html>
