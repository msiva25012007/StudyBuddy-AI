<!DOCTYPE html>
<html>
<head>
    <title>Quiz</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container mt-5">

    <div class="card p-4">

        <h2 class="mb-4">StudyBuddy Quiz</h2>

        <!-- Question 1 -->
        <h4>1. What is Java?</h4>

        <input type="radio" name="q1" value="Language"> Language <br>
        <input type="radio" name="q1" value="Database"> Database <br>
        <input type="radio" name="q1" value="Browser"> Browser <br><br>

        <!-- Question 2 -->
        <h4>2. What does HTML stand for?</h4>

        <input type="radio" name="q2" value="Hyper Text Markup Language">
        Hyper Text Markup Language <br>

        <input type="radio" name="q2" value="High Text Machine Language">
        High Text Machine Language <br>

        <input type="radio" name="q2" value="Home Tool Markup Language">
        Home Tool Markup Language <br><br>

        <!-- Question 3 -->
        <h4>3. Which database is used in StudyBuddy AI?</h4>

        <input type="radio" name="q3" value="MySQL"> MySQL <br>
        <input type="radio" name="q3" value="MongoDB"> MongoDB <br>
        <input type="radio" name="q3" value="PostgreSQL"> PostgreSQL <br><br>

        <button class="btn btn-success" onclick="submitQuiz()">
            Submit Quiz
        </button>

        <h3 class="mt-4" id="result"></h3>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
