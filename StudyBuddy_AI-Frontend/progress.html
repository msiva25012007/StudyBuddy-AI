
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyBuddy AI - Learning Analytics</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar navbar-dark custom-navbar">
    <div class="container">
        <a class="navbar-brand fw-bold">🎓 StudyBuddy AI</a>

        <a href="dashboard.html" class="btn btn-primary btn-sm">
            Dashboard
        </a>
    </div>
</nav>

<section class="dashboard-header">
    <div class="container text-center">
        <h1>📈 Learning Analytics</h1>
        <p>Monitor your learning performance and achievements</p>
    </div>
</section>

<div class="container my-5">

    <div class="row g-4">

        <div class="col-md-3">
            <div class="dashboard-card">
                <div class="icon">📚</div>
                <h5>Notes Generated</h5>
                <h2>25</h2>
            </div>
        </div>

        <div class="col-md-3">
            <div class="dashboard-card">
                <div class="icon">📝</div>
                <h5>Quizzes Completed</h5>
                <h2>12</h2>
            </div>
        </div>

        <div class="col-md-3">
            <div class="dashboard-card">
                <div class="icon">⏱</div>
                <h5>Study Hours</h5>
                <h2>48</h2>
            </div>
        </div>

        <div class="col-md-3">
            <div class="dashboard-card">
                <div class="icon">🔥</div>
                <h5>Learning Streak</h5>
                <h2>15 Days</h2>
            </div>
        </div>

    </div>

    <div class="dashboard-card mt-5">

        <h4>Overall Progress</h4>

        <div class="progress mt-4" style="height:25px;">
            <div class="progress-bar bg-success"
                 role="progressbar"
                 style="width:80%">
                80%
            </div>
        </div>

        <p class="mt-3">
            You have completed 80% of your planned learning goals this month.
        </p>

    </div>

</div>

</body>
</html>
